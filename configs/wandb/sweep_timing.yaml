# W&B Sweep: ORT-profile every full ONNX under data/NN_Filtering.
# Create+run:  invoke wandb-sweep-timing-run
# Agents:      invoke wandb-sweep-timing-agent --sweep-id=<id> --devices=all
#
# Each run uses use_ort_profiler=true: ORT cumulative runtime per node, then
# NVML power. Export with ``invoke export-dataset``; geyik expands each model
# into one training sample per node prefix via nodes_file.
# Metric kept for sweep schema; with repeats=1, CV is undefined.
#
# Local invoke option (stripped before ``wandb sweep``; not a W&B hyperparam).
# Set true to pin GPU application clocks before agents start.
# CLI override: ``invoke ... --lock-clocks=true|false`` (default ``auto`` = YAML).
lock_clocks: false
program: src/geyikbench/wandb_sweep_timing.py
method: grid
metric:
  name: latency_ms_mean_cv
  goal: minimize
# Do not append ${args} — hyperparameters are read via wandb.config only.
command:
  - ${env}
  - python
  - ${program}
parameters:
  warmup_s:
    value: 10
  runs_s:
    value: 10
  # Outer sweep repeats (legacy wall-clock CV). Keep 1 when using ORT trials.
  repeats:
    value: 1
  # Independent ORT + NVML full-pass repeats (CI / means). Same as benchmark.trials.
  trials:
    value: 10
  use_ort_profiler:
    value: true
  settle_iters:
    value: 3
  # Host GPU index. With multiple agents, prefer launching each with
  # CUDA_VISIBLE_DEVICES=<gpu> and leave device: 0 (remapped).
  device:
    value: 0
  model:
    values:
      - data/NN_Filtering/HOP/HOP.onnx
      - data/NN_Filtering/HOP4/HOP4.onnx
      - data/NN_Filtering/LOP/LOP.onnx
      - data/NN_Filtering/LOP3/LOP3.onnx
      - data/NN_Filtering/LOP4/LOP4.onnx
      - data/NN_Filtering/LOP5/LOP5.onnx
      - data/NN_Filtering/LOP6/LOP6.onnx
      - data/NN_Filtering/LOP7/LOP7.onnx
      - data/NN_Filtering/VLOP/VLOP.onnx
      - data/NN_Filtering/VLOP2/VLOP2.onnx
      - data/NN_Filtering/VLOP3/VLOP3.onnx
      - data/NN_Filtering/VLOP4/VLOP4.onnx
  batch_size:
    value: 1
  seed:
    value: 42
  project:
    value: geyikbench
